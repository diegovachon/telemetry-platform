# Local H2 database, stored as a file at ./data/telemetry.mv.db
# so data survives restarts. Swapping to Azure SQL later means
# changing these four lines (plus the driver dependency in pom.xml)
# -- no Java code changes needed.
spring.datasource.url=jdbc:h2:file:./data/telemetry
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-creates/updates tables from the @Entity classes. Fine while
# iterating locally; you'd move to explicit migrations (e.g. Flyway)
# before this ever touches a shared/production database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional web-based DB browser at http://localhost:8080/h2-console
# Useful for eyeballing saved rows without writing curl/SQL yourself.
spring.h2.console.enabled=true
